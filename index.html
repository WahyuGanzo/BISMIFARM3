<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISMI FARM 3</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f1ea;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background-color: #ffffff;
            margin-top: 50px;
            margin-bottom: 50px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #2c5e1a; /* Hijau tua */
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        /* Styling untuk gambar */
        .image-container img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid #e0a96d; /* Warna kayu/coklat muda */
            margin-bottom: 30px;
        }

        /* Styling untuk container tombol */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Styling untuk tombol */
        .btn {
            display: inline-block;
            background-color: #e0a96d;
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #c98a4b;
            transform: translateY(-2px);
        }

        .btn.primary {
            background-color: #2c5e1a;
        }

        .btn.primary:hover {
            background-color: #1f4212;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BISMI FARM 3 - KG RAMBUTAN</h1>
        <p class="subtitle">Pusat Informasi & Manajemen Broiler</p>

        <div class="image-container">
            <img src="https://i.imgur.com/8tnZwcy.png" alt="BANNER BISMI">
        </div>

        <div class="button-group">
            <a href="https://docs.google.com/spreadsheets/d/15vZBIZWramE0yeYd2_iRkrd-bArJVoc0wHn0pLrirUg/edit?usp=sharing" class="btn primary">DOC PLAN FARM 3 - KG RAMBUTAN 2026</a>
            <a href="https://docs.google.com/spreadsheets/d/102GcJbfsXl_pnqQtN32NYuELC7y_bN5770omi4mNARY/edit?usp=sharing" class="btn">PERSENTASE KEMATIAN FARM 3 - KG RAMBUTAN</a>
            <a href="https://averagecalculatorbismi.vercel.app/" class="btn">BISMI AVERAGE CALCULATOR</a>
        </div>

        <div class="footer">
            &copy; 2026 Ganzo Studio.
        </div>
    </div>

</body>
</html>
